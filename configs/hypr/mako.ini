# Modo DND (Super+N): oculta notificaciones de apps
[mode=dnd]
invisible=1

# Popups del sistema (notify-send desde scripts: volumen, brillo, batería, wallpaper, red, perfil): siempre visibles.
# Va después de [mode=dnd] porque en mako la última sección que define una opción gana.
[app-name=notify-send]
invisible=0
