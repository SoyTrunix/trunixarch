# Modo DND (Super+N): oculta notificaciones de apps
[mode=dnd]
invisible=1

# Popups del sistema (notify-send desde scripts: volumen, brillo, batería, red, perfil, batería baja):
# override explícito combinando ambos criterios para que gane sobre [mode=dnd].
[mode=dnd app-name=notify-send]
invisible=0
