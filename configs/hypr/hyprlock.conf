background {
    monitor =
    path = __HOME__/Pictures/Wallpapers/Wallpaper.jpg
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.2
    outer_color = rgba(137, 180, 250, 1)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = Password...
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(205, 214, 244, 1)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}
