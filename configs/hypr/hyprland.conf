# ============================================================
# Hyprland config independiente (sin caelestia) - Waybar + Wofi
# No depende de ~/.config/hypr (caelestia). 100% autocontenido.
# ============================================================

$terminal = foot
$fileManager = thunar
$menu = fuzzel --config ~/.config/fuzzel/fuzzel.ini
$mainMod = SUPER

# ---- Monitores ----
# Replicá acá tu config real si hace falta (resolución/Hz/posición).
# "preferred" = usa la mejor resolución/Hz que detecte automáticamente.
monitor = eDP-1, preferred, 0x0, 1
monitor = HDMI-A-1, 1920x1080@100, auto, 1

# ---- Autostart ----
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = xrdb -merge ~/.Xresources
exec-once = xsettingsd -c ~/.config/xsettingsd/xsettingsd.conf
exec-once = ~/.config/hypr/cursor-sync.sh
exec-once = ~/.config/hypr/cursor-watch.sh
exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once = mako -c ~/.config/hypr/mako.ini
exec-once = sleep 1 && hyprpaper -c ~/.config/hypr/hyprpaper.conf
exec-once = hypridle --config ~/.config/hypr/hypridle.conf
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ---- Variables de entorno ----
env = XCURSOR_THEME,Qogir-Dark
env = XCURSOR_SIZE,18
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GTK_THEME,adw-gtk3-dark
env = QT_STYLE_OVERRIDE,Fusion

# ---- Layout e inputs ----
input {
    kb_layout = latam
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

general {
    gaps_in = 2
    gaps_out = 2
    border_size = 1
    col.active_border = rgba(6c7086ff)
    col.inactive_border = rgba(3a3a3aaa)
    layout = dwindle
    # Las ventanas nuevas abren flotantes por default (estilo KDE).
    # Si querés que abran en tiling como Hyprland clásico, poné esto en false.
}

decoration {
    rounding = 5
    blur {
        enabled = true
        size = 8
        passes = 2
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, default
}

dwindle {
    preserve_split = true
}

gestures {
    workspace_swipe_distance = 700
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ---- Ventanas siempre flotantes (estilo KDE/escritorio tradicional) ----
# Comentá esta línea si en algún momento querés volver a tiling por default.
windowrule = match:class .*, float on

# ---- Atajos principales ----
bind = $mainMod, T, exec, $terminal
bind = CTRL SHIFT, Escape, exec, foot -T "btop" btop
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# Mover foco
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse para mover/redimensionar ventanas flotantes (como KDE: Super+arrastrar)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Mantener SUPER + X y mover el mouse para redimensionar sin necesidad de click derecho
bindm = $mainMod, X, resizewindow

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, grim - | wl-copy

# Bloqueo de pantalla
bind = $mainMod, L, exec, hyprlock --config ~/.config/hypr/hyprlock.conf
bind = $mainMod, B, exec, foot -T "wallpaper-switcher" -W 60x20 ~/.config/hypr/wallpaper-menu.sh
bind = $mainMod, N, exec, makoctl mode -t dnd && notify-send "Notifications" "$(makoctl mode | grep -q dnd && echo Disabled || echo Enabled)"
bind = $mainMod, C, exec, ~/.config/hypr/clipboard-menu.sh

# La ventana del selector de wallpapers siempre centrada y flotante
windowrule = match:title wallpaper-switcher, float on
windowrule = match:title wallpaper-switcher, center on
windowrule = match:title wallpaper-switcher, size 700 500

# Volumen / brillo (multimedia)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && pkill -RTMIN+8 waybar
bind = ,XF86AudioNext, exec, playerctl next
bind = ,XF86AudioPrev, exec, playerctl previous
bind = ,XF86AudioPlay, exec, playerctl play-pause
bind = ,XF86AudioPause, exec, playerctl play-pause
bind = ,XF86AudioStop, exec, playerctl stop
bind = CTRL $mainMod, X, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && pkill -RTMIN+8 waybar
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
