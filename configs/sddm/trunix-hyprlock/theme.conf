[General]
# Ruta al wallpaper. install.sh reemplaza __WALLPAPER__ por la ruta real
# del wallpaper del usuario (la misma que usan hyprlock.conf / hyprpaper.conf).
background=__WALLPAPER__

# Paleta Catppuccin Mocha (igual a hyprlock.conf / mako.ini del repo)
colorBg=#1e1e2e
colorText=#cdd6f4
colorBorder=#45475a
colorAccent=#89b4fa
colorError=#f38ba8

fontFamily=JetBrainsMono Nerd Font
clockFontSize=90
borderRadius=10

# Blur sutil del fondo, replicando blur_passes=2 / blur_size=4 de hyprlock
blurRadius=32
